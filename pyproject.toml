[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vkusvill-agent"
version = "0.1.0"
description = "Telegram bot that builds VkusVill shopping carts via OpenAI Responses API and remote MCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0.0",
    "python-dotenv>=1.0.1",
    "python-telegram-bot>=22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that call external OpenAI and MCP services",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001"]
